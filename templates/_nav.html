<header id="siteHeader">
  <nav>
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h3l2-7 4 14 3-9 2 5h4" stroke="#0b0714" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-word">kick-clipper</span>
    </a>
    <ul class="nav-links">
      <li><a href="/how-it-works" class="{{ 'active' if active == 'how' }}">How it works</a></li>
      <li><a href="/pricing" class="{{ 'active' if active == 'pricing' }}">Pricing</a></li>
      <li><a href="/faq" class="{{ 'active' if active == 'faq' }}">FAQ</a></li>
      {% if current_user.is_authenticated %}
      <li><a href="/dashboard" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a></li>
      {% endif %}
    </ul>
    {% if current_user.is_authenticated %}
      <a class="nav-cta" href="/dashboard">Open the dashboard</a>
    {% else %}
      <span style="display:flex; align-items:center; gap:18px;">
        <a class="nav-ghost" href="/login">Log in</a>
        <a class="nav-cta" href="/signup">Start free</a>
      </span>
    {% endif %}
  </nav>
</header>
