name: KickClipper CI

on:
  push:
    branches: [main, launch-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-only-not-for-production
      DEMO_MODE: "1"
      DISABLE_ENV_PROXY: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit
      - name: Reject committed secrets and runtime data
        run: python scripts/check_repository_safety.py
      - name: Compile Python
        run: python -m compileall -q .
      - name: Critical lint checks
        run: ruff check --select E9,F63,F7,F82 .
      - name: Unit and offline integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
