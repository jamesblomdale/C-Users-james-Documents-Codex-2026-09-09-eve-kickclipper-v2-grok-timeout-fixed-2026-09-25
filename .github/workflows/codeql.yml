name: CodeQL

on:
  push:
    branches: [main, launch-hardening]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 4 * * 3"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      # This private repository has no GitHub Code Security entitlement yet.
      # Run the scan and retain its SARIF report without attempting an upload.
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: never
      - uses: actions/upload-artifact@v6
        with:
          name: codeql-sarif
          path: codeql-results/
          if-no-files-found: error
